<!DOCTYPE html>                                   <!-- Avisa que es una página HTML moderna -->
<html lang="es">                                  <!-- Abre la página, en español -->
  <head>                                          <!-- Zona invisible: datos de la página -->
    <meta charset="UTF-8">                        <!-- Permite acentos y ñ -->
    <title>404 | Página perdida</title>           <!-- Texto de la pestaña del navegador -->
  </head>                                         <!-- Cierra la zona invisible -->
  <body>                                          <!-- Zona visible -->
    <main>                                        <!-- Contenido principal -->
      <h1>404</h1>                                <!-- El número grande del error -->
      <p>Esta página se perdió.</p>               <!-- Explica qué pasó -->
      <h2>Mientras tanto puedes:</h2>             <!-- Subtítulo de las opciones -->
      <ul>                                        <!-- Lista sin números -->
        <li>Revisar que escribiste bien la dirección</li> <!-- Opción 1 -->
        <li>Tomarte un café</li>                  <!-- Opción 2 -->
        <li>Volver mañana a ver cómo mejoró esta página</li> <!-- Opción 3: gancho para la serie -->
      </ul>                                       <!-- Cierra la lista -->
      <a href="#">Volver al inicio</a>            <!-- Enlace provisional; # no lleva a ningún lado -->
    </main>                                       <!-- Cierra el contenido principal -->
  </body>                                         <!-- Cierra la zona visible -->
</html>                                           <!-- Cierra la página -->
